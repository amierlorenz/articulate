[project]
name = "articulate"
version = "0.1.0"
description = "Second brain and study curator"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pypdfium2>=4.30.0",
    "ocrmac>=1.0.0",
    "python-ulid>=3.0.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
articulate = "articulate.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/articulate"]

[dependency-groups]
dev = [
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: marks tests requiring real personal fixtures in DATA/fixtures/real",
]
