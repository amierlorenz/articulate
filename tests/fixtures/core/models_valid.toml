[gemini]
keychain_service = "articulate-gemini"
timeout_s = 600
long_timeout_s = 1200

[gemini.models."gemini-3.8-flash"]
rpm = 5
rpd = 20
[gemini.models."gemini-3.5-flash-lite"]
rpm = 15
rpd = 500
reserve = 40

[claude]
model = "sonnet"
weekly_ceiling_pct = 50.0
session_ceiling_pct = 70.0
max_calls_per_night = 15
usage_timeout_s = 30

[ollama]
url = "http://127.0.0.1:11434"
text_model = "qwen3:8b"
embed_model = "embeddinggemma"
vl_model = "qwen3-vl:8b-instruct"

[chains]
extract = ["gemini-3.8-flash", "claude@ramp"]
route_file = ["gemini-3.5-flash-lite"]
